
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#160510">
<title>أنتِ باسمة وبسمتي ❤️</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: Tahoma, Arial, sans-serif;
    background: radial-gradient(circle at center,
    #671a3c, #270b1c 55%, #09030a);
    color: white;
}

.background {
    position: fixed;
    inset: 0;
    background:
    radial-gradient(circle at 20% 20%, #ff4b8725, transparent 35%),
    radial-gradient(circle at 80% 80%, #ff174425, transparent 35%);
    animation: bg 8s infinite alternate;
}

@keyframes bg {
    to { transform: scale(1.2); }
}

.stars {
    position: fixed;
    inset: 0;
    pointer-events: none;
}

.star {
    position: absolute;
    width: 3px;
    height: 3px;
    background: white;
    border-radius: 50%;
    box-shadow: 0 0 12px #ffb4d0;
    animation: twinkle 2s infinite alternate;
}

@keyframes twinkle {
    from {opacity: .2; transform: scale(.6);}
    to {opacity: 1; transform: scale(1.6);}
}

.card {
    position: relative;
    z-index: 2;
    width: min(90%, 480px);
    padding: 40px 22px;
    text-align: center;
    border: 1px solid #ff91b555;
    border-radius: 30px;
    background: rgba(255,255,255,.07);
    backdrop-filter: blur(16px);
    box-shadow: 0 0 65px #ff176c35,
                inset 0 0 30px #ffffff0a;
    animation: appear 1.5s ease;
}

@keyframes appear {
    from {opacity: 0; transform: translateY(30px) scale(.9);}
    to {opacity: 1; transform: translateY(0) scale(1);}
}

.rose {
    font-size: 110px;
    display: inline-block;
    filter: drop-shadow(0 0 25px #ff367d);
    animation: rose 3s ease-in-out infinite;
}

@keyframes rose {
    0%,100% {transform: translateY(0) rotate(-8deg) scale(1);}
    50% {transform: translateY(-15px) rotate(8deg) scale(1.12);}
}

h1 {
    margin: 20px 0;
    font-size: clamp(27px, 7vw, 40px);
    color: #ffd4e3;
    text-shadow: 0 0 15px #ff397d, 0 0 35px #ff397d;
    animation: glow 2s infinite alternate;
}

@keyframes glow {
    to {text-shadow: 0 0 30px #ff397d, 0 0 55px #ff397d;}
}

.line {
    width: 100px;
    height: 2px;
    margin: 20px auto;
    background: linear-gradient(90deg, transparent, #ff9dbb, transparent);
}

.subtitle {
    color: #ffe0eb;
    font-size: 18px;
    line-height: 2;
    margin: 15px auto 25px;
    text-shadow: 0 0 12px #ff6b9c;
    animation: appear 2s ease;
}

.music-btn {
    padding: 14px 28px;
    border: 1px solid #ff9cba;
    border-radius: 50px;
    background: linear-gradient(135deg, #ff4a82, #9c164f);
    color: white;
    font-size: 16px;
    cursor: pointer;
    box-shadow: 0 0 25px #ff397d55;
    transition: .3s;
}

.music-btn:hover {
    transform: scale(1.08);
    box-shadow: 0 0 35px #ff397d;
}

.music-note {
    margin-top: 20px;
    font-size: 13px;
    color: #ffb5cc;
    letter-spacing: 2px;
}

.footer {
    margin-top: 22px;
    color: #ff9fba;
    font-size: 20px;
}

/* ورود والقلوب */
.floating {
    position: fixed;
    top: -50px;
    z-index: 1;
    pointer-events: none;
    animation: falling linear forwards;
}

@keyframes falling {
    to {
        transform: translateY(110vh) rotate(500deg);
        opacity: 0;
    }
}

/* القلوب الطائرة */
.heart {
    position: fixed;
    bottom: -40px;
    pointer-events: none;
    animation: heartUp linear forwards;
    z-index: 1;
}

@keyframes heartUp {
    to {
        transform: translateY(-110vh) scale(1.8);
        opacity: 0;
    }
}

/* الفراشات */
.butterfly {
    position: fixed;
    font-size: 24px;
    pointer-events: none;
    animation: butterflyMove 9s linear forwards;
}

@keyframes butterflyMove {
    0% {transform: translate(0,0) rotate(0deg);}
    50% {transform: translate(70px,-180px) rotate(20deg);}
    100% {transform: translate(-50px,-500px) rotate(-20deg); opacity: 0;}
}

@media(max-width:400px) {
    .card {padding: 30px 15px;}
    .rose {font-size: 90px;}
    .subtitle {font-size: 16px;}
}
</style>
</head>

<body>

<div class="background"></div>
<div class="stars" id="stars"></div>

<div class="card">

    <div class="rose">🌹</div>

    <h1>أنتِ باسمة وبسمتي ❤️</h1>

    <div class="line"></div>

    <p class="subtitle">
        ابتسامتكِ حكاية جميلة،<br>
        ووجودكِ أجمل أقداري ❤️
    </p>

    <button class="music-btn" id="musicBtn">
        🎵 تشغيل الموسيقى
    </button>

    <div class="music-note">
        ♡ MUSIC FOR YOU ♡
    </div>

    <div class="footer">
        ✨ 🌹 ✨
    </div>

</div>

<script>
// النجوم
for (let i = 0; i < 75; i++) {
    const star = document.createElement("span");
    star.className = "star";
    star.style.left = Math.random() * 100 + "%";
    star.style.top = Math.random() * 100 + "%";
    star.style.animationDelay = Math.random() * 3 + "s";
    document.getElementById("stars").appendChild(star);
}

// ورود وقلوب متساقطة
function createFlower() {
    const flower = document.createElement("div");
    flower.className = "floating";
    const items = ["🌹","🌸","🌷","💗","✨"];
    flower.textContent = items[Math.floor(Math.random()*items.length)];
    flower.style.left = Math.random()*100 + "vw";
    flower.style.fontSize = (18+Math.random()*24)+"px";
    flower.style.animationDuration = (5+Math.random()*6)+"s";
    document.body.appendChild(flower);
    setTimeout(() => flower.remove(), 12000);
}
setInterval(createFlower, 450);

// قلوب صاعدة
function createHeart() {
    const heart = document.createElement("div");
    heart.className = "heart";
    heart.textContent = ["❤️","💕","💗","💖"][Math.floor(Math.random()*4)];
    heart.style.left = Math.random()*100 + "vw";
    heart.style.fontSize = (15+Math.random()*20)+"px";
    heart.style.animationDuration = (6+Math.random()*5)+"s";
    document.body.appendChild(heart);
    setTimeout(() => heart.remove(), 12000);
}
setInterval(createHeart, 1200);

// فراشات
function createButterfly() {
    const butterfly = document.createElement("div");
    butterfly.className = "butterfly";
    butterfly.textContent = "🦋";
    butterfly.style.left = Math.random()*100 + "vw";
    butterfly.style.top = (40+Math.random()*50) + "vh";
    document.body.appendChild(butterfly);
    setTimeout(() => butterfly.remove(), 9500);
}
setInterval(createButterfly, 4000);

// موسيقى أصلية هادئة
let audioContext = null;
let playing = false;
let timer = null;
let index = 0;

const melody = [
    261.63,329.63,392,329.63,
    293.66,349.23,440,349.23,
    261.63,329.63,392,523.25,
    440,392,329.63,293.66
];

function playNote() {
    if (!playing) return;

    const osc = audioContext.createOscillator();
    const gain = audioContext.createGain();

    osc.type = "sine";
    osc.frequency.value = melody[index % melody.length];

    gain.gain.setValueAtTime(0.0001,audioContext.currentTime);
    gain.gain.exponentialRampToValueAtTime(
        0.07,audioContext.currentTime+0.15
    );
    gain.gain.exponentialRampToValueAtTime(
        0.0001,audioContext.currentTime+1.5
    );

    osc.connect(gain);
    gain.connect(audioContext.destination);

    osc.start();
    osc.stop(audioContext.currentTime+1.6);
    index++;
}

document.getElementById("musicBtn").addEventListener("click",async function() {

    if (!audioContext) {
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
    }

    if (!playing) {
        await audioContext.resume();
        playing = true;
        this.textContent = "⏸ إيقاف الموسيقى";
        playNote();
        timer = setInterval(playNote,750);
    } else {
        playing = false;
        clearInterval(timer);
        this.textContent = "🎵 تشغيل الموسيقى";
        await audioContext.suspend();
    }
});
</script>

</body>
</html>

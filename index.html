<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مرحباً بك في موقع كوفي</title>
    <!-- استيراد خط عربي أنيق من جوجل -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
        }

        body {
            /* خلفية تدمج لون القهوة مع صورة تعبيرية وتعتيم خفيف */
            background: linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.6)), 
                        url('https://images.unsplash.com/photo-1447933601403-0c6688de566e?ixlib=rb-1.2.1&auto=format&fit=crop&w=1350&q=80') no-repeat center center fixed;
            background-size: cover;
            color: #fff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 50px;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(5px);
        }

        .logo {
            font-size: 24px;
            font-weight: 700;
            color: #d4a373;
        }

        nav a {
            color: #fff;
            text-decoration: none;
            margin-left: 20px;
            font-size: 16px;
            transition: color 0.3s;
        }

        nav a:hover {
            color: #d4a373;
        }

        .hero {
            text-align: center;
            padding: 0 20px;
            max-width: 800px;
            margin: auto;
        }

        .hero h1 {
            font-size: 48px;
            margin-bottom: 20px;
            color: #fefae0;
        }

        .hero p {
            font-size: 18px;
            margin-bottom: 30px;
            color: #d4d4d4;
            line-height: 1.6;
        }

        .btn {
            display: inline-block;
            background-color: #bc6c25;
            color: white;
            padding: 12px 30px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: 600;
            transition: background 0.3s, transform 0.2s;
        }

        .btn:hover {
            background-color: #dda15e;
            transform: translateY(-3px);
        }

        footer {
            text-align: center;
            padding: 15px;
            background: rgba(0, 0, 0, 0.5);
            font-size: 14px;
            color: #aaa;
        }

        /* تصميم متجاوب للشاشات الصغيرة */
        @media (max-width: 768px) {
            header {
                padding: 15px 20px;
                flex-direction: column;
                gap: 10px;
            }
            .hero h1 {
                font-size: 36px;
            }
            .hero p {
                font-size: 16px;
            }
        }
    </style>
</head>
<body>

    <!-- رأس الصفحة (الشاوة والقوائم) -->
    <header>
        <div class="logo">☕ كوفي شوب</div>
        <nav>
            <a href="#">الرئيسية</a>
            <a href="#">القائمة</a>
            <a href="#">من نحن</a>
            <a href="#">اتصل بنا</a>
        </nav>
    </header>

    <!-- المحتوى الرئيسي (الترحيب) -->
    <section class="hero">
        <h1>مرحباً بك في عالم القهوة الأصيلة</h1>
        <p>استمتع بأجود أنواع القهوة المحمصة بعناية لتمنحك طاقة تبدأ بها يومك بكل حيوية. تفضل باكتشاف قائمتنا المميزة.</p>
        <a href="#" class="btn">استعرض القائمة</a>
    </section>

    <!-- ذيل الصفحة -->
    <footer>
        <p>جميع الحقوق محفوظة &copy; 2026 موقع كوفي</p>
    </footer>

</body>
</html>

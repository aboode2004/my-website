<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>أنتِ باسمة وبسمتي ❤️</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    overflow: hidden;
    font-family: Tahoma, Arial;
    background: radial-gradient(circle at center,
        #4a1028, #1b0614, #080208);
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
}

.container {
    text-align: center;
    z-index: 2;
    padding: 25px;
    width: 100%;
}

.rose {
    font-size: 90px;
    animation: rose 3s infinite ease-in-out;
    filter: drop-shadow(0 0 20px #ff477e);
}

h1 {
    font-size: clamp(28px, 7vw, 45px);
    color: #ffb5ca;
    margin: 25px 0;
    text-shadow: 0 0 20px #ff3975;
    animation: glow 2s infinite alternate;
}

.message {
    font-size: 20px;
    line-height: 2;
    color: #ffe0eb;
    margin: 15px auto 30px;
    max-width: 450px;
}

button {
    border: 1px solid #ff91b2;
    background: linear-gradient(135deg, #ff3975, #a50048);
    color: white;
    padding: 14px 30px;
    border-radius: 40px;
    font-size: 17px;
    cursor: pointer;
    box-shadow: 0 0 20px #ff3975;
    transition: .3s;
}

button:active {
    transform: scale(.95);
}

.footer {
    margin-top: 30px;
    color: #ff9fbd;
    font-size: 14px;
}

.floating {
    position: fixed;
    top: -50px;
    pointer-events: none;
    animation: fall linear forwards;
    z-index: 1;
}

@keyframes fall {
    to {
        transform: translateY(110vh) rotate(360deg);
        opacity: 0;
    }
}

@keyframes rose {
    0%, 100% {transform: scale(1) rotate(-5deg);}
    50% {transform: scale(1.15) rotate(5deg);}
}

@keyframes glow {
    from {text-shadow: 0 0 10px #ff3975;}
    to {text-shadow: 0 0 35px #ff3975, 0 0 60px #ff8eb3;}
}
</style>
</head>

<body>

<div class="container">

    <div class="rose">🌹</div>

    <h1>أنتِ باسمة وبسمتي ❤️</h1>

    <div class="message">
        أنتِ أجمل صدفة في حياتي،<br>
        وأنتِ الفرحة التي تسكن قلبي،<br>
        وكل الورود لا تشبه جمال ابتسامتكِ 🌷
        <br><br>
        وجودكِ يجعل أيامي أجمل ❤️
    </div>

    <button id="musicBtn" onclick="toggleMusic()">
        🎵 تشغيل الموسيقى
    </button>

    <div class="footer">
        صُنعت بكل حب ❤️
    </div>

</div>

<script>
let audioContext;
let playing = false;
let melodyTimer;
let noteIndex = 0;

const notes = [
    261.63, 329.63, 392.00, 329.63,
    293.66, 349.23, 440.00, 349.23,
    261.63, 329.63, 392.00, 523.25,
    440.00, 392.00, 329.63, 293.66
];

function playNote() {
    if (!playing || !audioContext) return;

    const oscillator = audioContext.createOscillator();
    const gain = audioContext.createGain();

    oscillator.type = "sine";
    oscillator.frequency.value = notes[noteIndex % notes.length];

    gain.gain.setValueAtTime(0.0001, audioContext.currentTime);
    gain.gain.exponentialRampToValueAtTime(
        0.09, audioContext.currentTime + 0.15
    );
    gain.gain.exponentialRampToValueAtTime(
        0.0001, audioContext.currentTime + 1.2
    );

    oscillator.connect(gain);
    gain.connect(audioContext.destination);

    oscillator.start();
    oscillator.stop(audioContext.currentTime + 1.3);

    noteIndex++;
}

async function toggleMusic() {
    const btn = document.getElementById("musicBtn");

    if (!audioContext) {
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
    }

    if (!playing) {
        await audioContext.resume();
        playing = true;
        btn.innerHTML = "⏸ إيقاف الموسيقى";
        playNote();
        melodyTimer = setInterval(playNote, 650);
    } else {
        playing = false;
        clearInterval(melodyTimer);
        btn.innerHTML = "🎵 تشغيل الموسيقى";
        await audioContext.suspend();
    }
}

// ورود وقلوب متساقطة
function createFlower() {
    const flower = document.createElement("div");
    flower.className = "floating";

    const items = ["🌹", "🌸", "❤️", "🌷", "💗"];
    flower.innerHTML = items[Math.floor(Math.random() * items.length)];

    flower.style.left = Math.random() * 100 + "vw";
    flower.style.fontSize = (18 + Math.random() * 25) + "px";
    flower.style.animationDuration = (5 + Math.random() * 6) + "s";

    document.body.appendChild(flower);

    setTimeout(() => flower.remove(), 11000);
}

setInterval(createFlower, 450);

</script>

</body>
</html>
